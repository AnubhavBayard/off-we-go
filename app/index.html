<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7EFE2" />
    <title>Off We Go</title>
  </head>
  <body>
    <!-- Launch intro lives in the HTML so it animates on the first frame, before the JS bundle has loaded.
         Styles: .intro in src/index.css. main.tsx removes it when it ends or is tapped. -->
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro-mark"><span class="intro-ripple"></span><img class="intro-logo" src="/logo.jpg" alt="" /></div>
      <h1 class="intro-title"><span style="--i:0">O</span><span style="--i:1">f</span><span style="--i:2">f</span><span style="--i:3">&nbsp;</span><span style="--i:4">W</span><span style="--i:5">e</span><span style="--i:6">&nbsp;</span><span style="--i:7">G</span><span style="--i:8">o</span></h1>
      <p class="intro-tag">Eat your way around the world</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
